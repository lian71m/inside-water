<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      canvas {
        display: block;
      }

      #speedbox {
        position: fixed;
        bottom: 14px;
        right: 16px;
        font: 13px monospace;
        background: rgba(255, 255, 255, 0.85);
        padding: 8px 12px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        user-select: none;
      }

      #speed {
        width: 140px;
      }

      #legend {
        position: fixed;
        bottom: 14px;
        left: 16px;
        font: 13px monospace;
        background: rgba(255, 255, 255, 0.9);
        padding: 10px 12px;
        border-radius: 6px;
        user-select: none;
        display: none;
      }

      #legend .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 3px 0;
      }

      #legend .sw {
        width: 14px;
        height: 14px;
        border: 1px solid rgba(0, 0, 0, 0.3);
        flex: 0 0 auto;
      }

      #legend .title {
        font-weight: bold;
        margin-bottom: 6px;
      }
    </style>
  </head>

  <body>
    <canvas id="CANVAS"></canvas>
    <div id="speedbox">
      <label for="speed">speed</label>
      <input id="speed" type="range" min="1" max="60" step="1" value="8" />
      <span id="speedval">8</span>/s
    </div>
    <div id="legend">
      <div class="title">Regime map — your prospects from each spot</div>
      <div class="row"><span class="sw" style="background:#0000ff"></span> You win the race outright</div>
      <div class="row"><span class="sw" style="background:#00ff00"></span> Guaranteed cutoff (inside water)</div>
      <div class="row"><span class="sw" style="background:#ffff00"></span> Contested cutoff — it's a fight</div>
      <div class="row"><span class="sw" style="background:#ffffff"></span> You lose clean — no winning play</div>
    </div>
    <script>
      const CANVAS = document.getElementById("CANVAS");
      CANVAS.width = window.innerWidth * 0.9;
      CANVAS.height = window.innerHeight * 0.9;
      const CTX = CANVAS.getContext("2d");
      console.log("CANVAS", CANVAS.width, CANVAS.height);

      const MAX = 2 ** 8 - 1;
      const DT = 0.01;
      const DALPHA = 0.1;
      // Anchor positions the SIMILAR (river-frame) transform maps back onto.
      // These are snapshotted from the actual round-start positions in init(),
      // so the opponent really does stay fixed on screen while the player
      // moves relative to it. They must match the live start or the transform
      // blows the player off-screen.
      let GOALINITX = 0.5;
      let GOALINITY = 0;
      let OPPINITX = 0.5;
      let OPPINITY = 1;

      let HELP = false;
      let SIMILAR = true;
      let GOALX = GOALINITX;
      let GOALY = GOALINITY;
      let OPPX = OPPINITX;
      let OPPY = OPPINITY;
      let PLAYERMANUAL = false;
      let PLAYERSPEED = 0.9;
      let PLAYERX = 0;
      let PLAYERY = 1;
      let PLAYERANGLE = 0;

      // Holds the latest movement deltas / inside-water point so draw() can
      // render arrows even on frames where the sim isn't stepping (paused).
      let LAST = {
        playerdx: 0,
        playerdy: 0,
        oppdx: 0,
        oppdy: 0,
        insidewaterx: 0,
        insidewatery: 0,
      };

      function init() {
        // Goal fixed at top-center, opponent at bottom-center: this is the
        // river-frame baseline the SIMILAR transform keeps stationary.
        GOALX = 0.5;
        GOALY = 0;
        OPPX = 0.5;
        OPPY = 1;
        // Player starts off to one side so there's a real triangle to play.
        PLAYERX = 0.15 + 0.7 * Math.random();
        PLAYERY = 0.75 + 0.2 * Math.random();
        PLAYERSPEED = 1.5 * Math.random() + 0.5;

        // Snapshot the actual start as the transform anchors so opp/goal
        // really do stay put on screen during the round.
        GOALINITX = GOALX;
        GOALINITY = GOALY;
        OPPINITX = OPPX;
        OPPINITY = OPPY;
      }
      init();

      // function angle(x1, y1, x2, y2) {
      //   return Math.atan2(y2 - y1, x2 - x1)
      // } // ?
      function norm(x, y) {
        return Math.sqrt(x ** 2 + y ** 2);
      }
      function distance(x1, y1, x2, y2) {
        return norm(x2 - x1, y2 - y1);
      }
      function collinearity(x1, y1, x2, y2, x3, y3) {
        return x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2);
      }
      function calcnormedvector(x1, y1, x2, y2) {
        const d = distance(x1, y1, x2, y2);
        return [(x2 - x1) / d, (y2 - y1) / d];
      }
      function calcp(slowerx, slowery, fasterx, fastery, goalx, goaly) {
        const [ux, uy] = calcnormedvector(fasterx, fastery, goalx, goaly);
        return (slowerx - fasterx) * ux + (slowery - fastery) * uy;
      }
      function calcnormal(slowerx, slowery, fasterx, fastery, goalx, goaly) {
        const p = calcp(slowerx, slowery, fasterx, fastery, goalx, goaly);
        const [ux, uy] = calcnormedvector(fasterx, fastery, goalx, goaly);
        return [slowerx - fasterx - p * ux, slowery - fastery - p * uy];
      }
      function calch(slowerx, slowery, fasterx, fastery, goalx, goaly) {
        const [nx, ny] = calcnormal(
          slowerx,
          slowery,
          fasterx,
          fastery,
          goalx,
          goaly,
        );
        return norm(nx, ny);
      }
      function slowerwinsdirect(
        slowerx,
        slowery,
        fasterx,
        fastery,
        goalx,
        goaly,
        slowerspeed,
      ) {
        const dslower = distance(slowerx, slowery, goalx, goaly);
        const dfaster = distance(fasterx, fastery, goalx, goaly);
        // console.log("slowerwinsdirect", dslower, dfaster, slowerspeed);
        return dslower < slowerspeed * dfaster;
      }
      function insidewater(
        slowerx,
        slowery,
        fasterx,
        fastery,
        goalx,
        goaly,
        slowerspeed,
      ) {
        const h = calch(slowerx, slowery, fasterx, fastery, goalx, goaly);
        const p = calcp(slowerx, slowery, fasterx, fastery, goalx, goaly);
        // console.log("insidewater", h, p);
        return h * Math.sqrt(1 - slowerspeed ** 2) < slowerspeed * p;
      }
      function calcs(slowerspeed) {
        return slowerspeed / Math.sqrt(1 - slowerspeed ** 2);
      }
      // function insidewater2(slowerx, slowery, fasterx, fastery, goalx, goaly, slowerspeed) {
      //   let s = r / Math.sqrt(1-r**2)
      //   let h = calch(slowerx, slowery, fasterx, fastery, goalx, goaly)
      //   let p = calcp(slowerx, slowery, fasterx, fastery, goalx, goaly)
      //   let dfaster = distance(fasterx, fastery, goalx, goaly)
      //   let x = (p + s*h)/dfaster
      //   return 0 < x && x <= 1
      // }
      function guaranteedinsidewater(
        slowerx,
        slowery,
        fasterx,
        fastery,
        goalx,
        goaly,
        slowerspeed,
      ) {
        const h = calch(slowerx, slowery, fasterx, fastery, goalx, goaly);
        const p = calcp(slowerx, slowery, fasterx, fastery, goalx, goaly);
        const dfaster = distance(fasterx, fastery, goalx, goaly);
        // console.log("guaranteedinsidewater", h, p, dfaster);
        return (
          h * Math.sqrt((1 - slowerspeed) / (1 + slowerspeed)) <
          p - (1 - slowerspeed) * dfaster
        );
      }
      function insidewaterpoint(
        slowerx,
        slowery,
        fasterx,
        fastery,
        goalx,
        goaly,
        slowerspeed,
      ) {
        const h = calch(slowerx, slowery, fasterx, fastery, goalx, goaly);
        const p = calcp(slowerx, slowery, fasterx, fastery, goalx, goaly);
        const s = calcs(slowerspeed);
        const [ux, uy] = calcnormedvector(fasterx, fastery, goalx, goaly);
        // console.log("insidewaterpoint", h, p, s, ux, uy);
        return [fasterx + (p + s * h) * ux, fastery + (p + s * h) * uy];
      }

      function similar(x1, y1, x2, y2, x3, y3, x12, y12, x22, y22) {
        const ux = x2 - x1;
        const uy = y2 - y1;
        const vx = x22 - x12;
        const vy = y22 - y12;
        const wx = x3 - x1;
        const wy = y3 - y1;
        const pUx = -uy;
        const pUy = ux;
        const pVx = -vy;
        const pVy = vx;
        const d = ux ** 2 + uy ** 2;
        const a = (wx * ux + wy * uy) / d;
        const b = (wx * pUx + wy * pUy) / d;
        return [x12 + a * vx + b * pVx, y12 + a * vy + b * pVy];
      }

      function targetSlowerFaster(
        slowerx,
        slowery,
        fasterx,
        fastery,
        goalx,
        goaly,
        slowerspeed,
        dt,
      ) {
        let [slowertargetx, slowertargety] = [goalx, goaly];
        let [fastertargetx, fastertargety] = [goalx, goaly];
        const [insidewaterx, insidewatery] = insidewaterpoint(
          slowerx,
          slowery,
          fasterx,
          fastery,
          goalx,
          goaly,
          slowerspeed,
        );
        let regime = 0;
        if (
          slowerwinsdirect(
            slowerx,
            slowery,
            fasterx,
            fastery,
            goalx,
            goaly,
            slowerspeed,
          )
        ) {
          // slow wins direct, both to goal
          // console.log("slow wins direct");
          regime = 1;
        } else if (
          insidewater(
            slowerx,
            slowery,
            fasterx,
            fastery,
            goalx,
            goaly,
            slowerspeed,
          )
        ) {
          // slow to inside water
          // console.log("inside water possible");
          [slowertargetx, slowertargety] = [insidewaterx, insidewatery];
          if (
            guaranteedinsidewater(
              slowerx,
              slowery,
              fasterx,
              fastery,
              goalx,
              goaly,
              slowerspeed,
            )
          ) {
            // guaranteed inside water, fast to goal
            // console.log("guaranteed inside water");
            regime = 2;
          } else {
            // contested inside water, fast sidestap
            // console.log("contested inside water, faster sidestep");
            const h = calch(slowerx, slowery, fasterx, fastery, goalx, goaly);
            const [nx, ny] = calcnormal(
              slowerx,
              slowery,
              fasterx,
              fastery,
              goalx,
              goaly,
            );
            regime = 3;
            // console.log("h", h);
            let [nxh, nyh] = [0, 0];
            if (h != 0) {
              [nxh, nyh] = [nx / h, ny / h];
            }
            [fastertargetx, fastertargety] = [fasterx - nxh, fastery - nyh];
          }
        } else {
          // console.log("faster wins direct, no inside water");
          regime = 4;
        }
        return [
          slowertargetx,
          slowertargety,
          fastertargetx,
          fastertargety,
          insidewaterx,
          insidewatery,
          regime,
        ];
      }
      function deltaGivenTarget(x, y, targetx, targety, speed, dt) {
        const d = distance(targetx, targety, x, y);
        const factor = d == 0 ? 1 : (dt * speed) / d;
        const dx = factor * (targetx - x);
        const dy = factor * (targety - y);
        return [dx, dy];
      }
      function turn(playerx, playery, goalx, goaly, playerangle) {
        const dx = goalx - playerx;
        const dy = goaly - playery;
        const playertargetx =
          playerx + dx * Math.cos(playerangle) + dy * Math.sin(playerangle);
        const playertargety =
          playery - dx * Math.sin(playerangle) + dy * Math.cos(playerangle);
        return [playertargetx, playertargety];
      }
      function slowerFaster(playerx, playery, oppx, oppy, playerspeed) {
        let [slowerx, slowery, fasterx, fastery, speed] = [
          playerx,
          playery,
          oppx,
          oppy,
          playerspeed,
        ];
        if (1 < playerspeed) {
          [slowerx, slowery, fasterx, fastery, speed] = [
            oppx,
            oppy,
            playerx,
            playery,
            1 / playerspeed,
          ];
        }
        return [slowerx, slowery, fasterx, fastery, speed];
      }
      function delta(
        playerx,
        playery,
        oppx,
        oppy,
        goalx,
        goaly,
        playerangle,
        playerspeed,
        dt,
      ) {
        // console.log("delta2", playerx, playery, oppx, oppy, playerangle, playerspeed);
        let [slowerx, slowery, fasterx, fastery, speed] = slowerFaster(
          playerx,
          playery,
          oppx,
          oppy,
          playerspeed,
        );
        // console.log("delta25", slowerx, slowery, fasterx, fastery, speed);
        let [
          slowertargetx,
          slowertargety,
          fastertargetx,
          fastertargety,
          insidewaterx,
          insidewatery,
          regime,
        ] = targetSlowerFaster(
          slowerx,
          slowery,
          fasterx,
          fastery,
          goalx,
          goaly,
          speed,
          dt,
        );
        // console.log("delta3", slowertargetx, slowertargety, fastertargetx, fastertargety, regime);
        let [slowerdx, slowerdy] = deltaGivenTarget(
          slowerx,
          slowery,
          slowertargetx,
          slowertargety,
          playerspeed,
          dt,
        );
        // console.log("delta4", slowerdx, slowerdy);
        let [fasterdx, fasterdy] = deltaGivenTarget(
          fasterx,
          fastery,
          fastertargetx,
          fastertargety,
          1 / playerspeed,
          dt,
        );
        // console.log("delta5", fasterdx, fasterdy);
        let [playermanualtargetx, playermanualtargety] = turn(
          playerx,
          playery,
          goalx,
          goaly,
          playerangle,
        );
        // console.log("delta55", playermanualtargetx, playermanualtargety); // DEBUG
        let [playermanualdx, playermanualdy] = deltaGivenTarget(
          playerx,
          playery,
          playermanualtargetx,
          playermanualtargety,
          playerspeed,
          dt,
        );
        // console.log("delta6", playermanualdx, playermanualdy);
        if (1 < playerspeed) {
          [slowerdx, slowerdy, fasterdx, fasterdy] = [
            fasterdx,
            fasterdy,
            slowerdx,
            slowerdy,
          ];
        }
        // console.log("delta7", slowerdx, slowerdy, fasterdx, fasterdy, playermanualdx, playermanualdy);
        return [
          slowerdx,
          slowerdy,
          fasterdx,
          fasterdy,
          playermanualdx,
          playermanualdy,
          insidewaterx,
          insidewatery,
        ];
      }
      function newposition(
        playerx,
        playery,
        oppx,
        oppy,
        goalx,
        goaly,
        playerangle,
        playerspeed,
        playermanual,
        dt,
      ) {
        // console.log("newposition", dt, playerx, playery, oppx, oppy); // DEBUG
        let [
          playerdx,
          playerdy,
          oppdx,
          oppdy,
          playermanualdx,
          playermanualdy,
          insidewaterx,
          insidewatery,
        ] = delta(
          playerx,
          playery,
          oppx,
          oppy,
          goalx,
          goaly,
          playerangle,
          playerspeed,
          dt,
        );
        if (playermanual) {
          [playerdx, playerdy] = [playermanualdx, playermanualdy];
        }
        // console.log(
        //   "newposition delta",
        //   playerdx,
        //   playerdy,
        //   oppdx,
        //   oppdy,
        //   playermanualdx,
        //   playermanualdy,
        // ); // DEBUG
        if (SIMILAR) {
          const [playersimilarx, playersimilary] = similar(
            goalx,
            goaly,
            oppx + oppdx,
            oppy + oppdy,
            playerx + playerdx,
            playery + playerdy,
            GOALINITX,
            GOALINITY,
            OPPINITX,
            OPPINITY,
          );
          return [
            playersimilarx,
            playersimilary,
            OPPINITX,
            OPPINITY,
            playerdx,
            playerdy,
            oppdx,
            oppdy,
            insidewaterx,
            insidewatery,
          ];
        }

        return [
          playerx + playerdx,
          playery + playerdy,
          oppx + oppdx,
          oppy + oppdy,
          playerdx,
          playerdy,
          oppdx,
          oppdy,
          insidewaterx,
          insidewatery,
        ];
      }

      // Controls how fast the sim advances, in steps per second.
      // Lower = slower, more watchable game. Press +/- to change live.
      let STEPS_PER_SECOND = 8;
      let RUNNING = false;       // is the sim currently advancing?
      let GAMEOVER = false;      // has someone won the current round?
      let RESULT = "";           // last round result text
      let lastStepTime = 0;      // timestamp of the previous physics step

      function step() {
        const oldcollinearity = collinearity(
          PLAYERX,
          PLAYERY,
          OPPX,
          OPPY,
          GOALX,
          GOALY,
        );
        let [
          playerx,
          playery,
          oppx,
          oppy,
          playerdx,
          playerdy,
          oppdx,
          oppdy,
          insidewaterx,
          insidewatery,
        ] = newposition(
          PLAYERX,
          PLAYERY,
          OPPX,
          OPPY,
          GOALX,
          GOALY,
          PLAYERANGLE,
          PLAYERSPEED,
          PLAYERMANUAL,
          DT,
        );
        [PLAYERX, PLAYERY, OPPX, OPPY] = [playerx, playery, oppx, oppy];

        LAST.playerdx = playerdx;
        LAST.playerdy = playerdy;
        LAST.oppdx = oppdx;
        LAST.oppdy = oppdy;
        LAST.insidewaterx = insidewaterx;
        LAST.insidewatery = insidewatery;

        const newcollinearity = collinearity(
          PLAYERX,
          PLAYERY,
          OPPX,
          OPPY,
          GOALX,
          GOALY,
        );
        if (
          newcollinearity == 0 ||
          Math.sign(newcollinearity) != Math.sign(oldcollinearity)
        ) {
          if (
            distance(PLAYERX, PLAYERY, GOALX, GOALY) <=
            distance(OPPX, OPPY, GOALX, GOALY)
          ) {
            RESULT = "PLAYER WINS";
          } else {
            RESULT = "PLAYER LOSES";
          }
          GAMEOVER = true;
          RUNNING = false;
        }
      }

      // Single animation loop. Started exactly once at the bottom of the
      // script and never anywhere else, so there is only ever ONE loop alive.
      function loop(now) {
        if (RUNNING && now - lastStepTime >= 1000 / STEPS_PER_SECOND) {
          lastStepTime = now;
          step();
        }
        draw(
          PLAYERX,
          PLAYERY,
          OPPX,
          OPPY,
          GOALX,
          GOALY,
          LAST.playerdx,
          LAST.playerdy,
          LAST.oppdx,
          LAST.oppdy,
          PLAYERSPEED,
          LAST.insidewaterx,
          LAST.insidewatery,
        );
        drawHUD();
        requestAnimationFrame(loop);
      }

      function draw(
        playerx,
        playery,
        oppx,
        oppy,
        goalx,
        goaly,
        playerdx,
        playerdy,
        oppdx,
        oppdy,
        playerspeed,
        insidewaterx,
        insidewatery,
      ) {
        const size = 10;
        CTX.clearRect(0, 0, CANVAS.width, CANVAS.height);
        if (HELP) {
          drawRegimes(oppx, oppy, goalx, goaly, playerspeed);
          drawInside(insidewaterx, insidewatery, size, "green");
        }
        drawInside(goalx, goaly, size, "red");
        drawInside(playerx, playery, size, "blue");
        drawInside(oppx, oppy, size, "black");
        drawDirection(playerx, playery, playerdx, playerdy);
        drawDirection(oppx, oppy, oppdx, oppdy);
        // drawInside(0, 0, size, "green");
        // drawInside(1, 0, size, "green");
        // drawInside(1, 1, size, "green");
        // drawInside(0, 1, size, "green");
      }
      function drawSize(x, y, size) {
        let px = x * CANVAS.width;
        let py = y * CANVAS.height;
        let changed = false;
        if (px < 0) {
          px = 0;
          changed = true;
        } else if (CANVAS.width < px + size) {
          px = CANVAS.width - size;
          changed = true;
        }
        if (py < 0) {
          py = 0;
          changed = true;
        } else if (CANVAS.height < py + size) {
          py = CANVAS.height - size;
          changed = true;
        }
        const psize = changed ? size / 2 : size;
        return [px, py, psize];
      }
      function drawRegimes(oppx, oppy, goalx, goaly, playerspeed) {
        const image = CTX.createImageData(CANVAS.width, CANVAS.height).data;
        const GRANULARITY = 1;
        for (let y = 0; y < CANVAS.height; y++) {
          for (let x = 0; x < CANVAS.width; x++) {
            const p = (y * CANVAS.width + x) * 4;
            if (!(y % GRANULARITY == 0 && x % GRANULARITY == 0)) {
              image[p] = 0;
              image[p + 1] = 0;
              image[p + 2] = 0;
              image[p + 3] = 0;
              continue;
            }
            const [slowerx, slowery, fasterx, fastery, speed] = slowerFaster(
              x / CANVAS.width,
              y / CANVAS.height,
              oppx,
              oppy,
              playerspeed,
            );
            const [, , , , , , regime] = targetSlowerFaster(
              slowerx,
              slowery,
              fasterx,
              fastery,
              goalx,
              goaly,
              speed,
              1,
            );
            // The regime above is always from the SLOWER swimmer's view.
            // When the player is the FASTER swimmer, flip it to the player's
            // view so colors always mean the same thing for the player:
            //   win-clean(1) <-> lose-clean(4), guaranteed(2) <-> contested(3).
            // This recolors only; the regime math itself is unchanged.
            let displayRegime = regime;
            if (playerspeed > 1) {
              const flip = { 1: 4, 4: 1, 2: 3, 3: 2 };
              displayRegime = flip[regime];
            }
            let [r, g, b] = [MAX, MAX, MAX];
            if (displayRegime == 1) {
              [r, g, b] = [0, 0, MAX];
            } else if (displayRegime == 2) {
              [r, g, b] = [0, MAX, 0];
            } else if (displayRegime == 3) {
              [r, g, b] = [MAX, MAX, 0];
            }
            image[p] = r;
            image[p + 1] = g;
            image[p + 2] = b;
            image[p + 3] = MAX / 2;
          }
        }
        console.log("Regime:", oppx, oppy, goalx, goaly, playerspeed);
        CTX.putImageData(
          new ImageData(image, CANVAS.width, CANVAS.height),
          0,
          0,
        );
      }
      function drawInside(x, y, size, c) {
        const [px, py, psize] = drawSize(x, y, size);
        CTX.fillStyle = c;
        CTX.fillRect(px, py, psize, psize);
      }
      function drawDirection(x, y, dx, dy) {
        CTX.fillStyle = "black";
        CTX.beginPath();
        let [px, py, psize] = drawSize(x, y, 1);
        CTX.moveTo(px, py);
        [px, py, psize] = drawSize(x + dx, y + dy, 1);
        CTX.lineTo(px, py);
        CTX.stroke();
      }

      function newRound() {
        init();
        PLAYERANGLE = 0;
        PLAYERMANUAL = false;
        GAMEOVER = false;
        RESULT = "";
        RUNNING = false;
      }

      function drawHUD() {
        CTX.save();
        CTX.fillStyle = "rgba(0,0,0,0.85)";
        CTX.font = "14px monospace";
        CTX.textBaseline = "top";
        const lines = [
          "ENTER play/pause   R new round   SPACE regime map   S similar:" +
            (SIMILAR ? "on" : "off"),
          "Q / W steer player (manual mode)   speed=" +
            PLAYERSPEED.toFixed(2) +
            "   " +
            (PLAYERMANUAL ? "MANUAL" : "AUTO") +
            (RUNNING ? "   [running]" : "   [paused]"),
        ];
        lines.forEach((t, i) => CTX.fillText(t, 12, 12 + i * 18));
        if (GAMEOVER) {
          CTX.fillStyle =
            RESULT === "PLAYER WINS" ? "rgba(0,140,0,0.95)" : "rgba(180,0,0,0.95)";
          CTX.font = "bold 28px monospace";
          CTX.fillText(RESULT + " — press R", 12, 60);
        }
        CTX.restore();
      }

      window.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          if (GAMEOVER) {
            newRound();
          }
          RUNNING = !RUNNING;
          lastStepTime = performance.now();
        } else if (e.key === "r" || e.key === "R") {
          newRound();
        } else if (e.key === " ") {
          HELP = !HELP;
          document.getElementById("legend").style.display = HELP
            ? "block"
            : "none";
        } else if (e.key === "s") {
          SIMILAR = !SIMILAR;
        } else if (e.key === "q") {
          PLAYERMANUAL = true;
          PLAYERANGLE += DALPHA;
        } else if (e.key === "w") {
          PLAYERMANUAL = true;
          PLAYERANGLE -= DALPHA;
        } else if (e.key === "+" || e.key === "=") {
          setSpeed(STEPS_PER_SECOND + 2);
        } else if (e.key === "-" || e.key === "_") {
          setSpeed(STEPS_PER_SECOND - 2);
        }
      });

      // Single source of truth for sim speed: keep the variable, the slider,
      // and the readout in sync no matter which control changed it.
      const speedSlider = document.getElementById("speed");
      const speedVal = document.getElementById("speedval");
      function setSpeed(v) {
        STEPS_PER_SECOND = Math.max(1, Math.min(60, Math.round(v)));
        speedSlider.value = STEPS_PER_SECOND;
        speedVal.textContent = STEPS_PER_SECOND;
      }
      speedSlider.addEventListener("input", () => setSpeed(+speedSlider.value));
      // Keep focus on the page (not the slider) so Q/W/Enter keep working
      // right after dragging.
      speedSlider.addEventListener("change", () => speedSlider.blur());
      setSpeed(STEPS_PER_SECOND);

      requestAnimationFrame(loop);
    </script>
  </body>
</html>
