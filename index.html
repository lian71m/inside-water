<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById("canvas");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext("2d");
    let forceRatio = 1.1
    let forceDirectionA = Math.PI
    let forceDirectionB = Math.PI
    let radius = Math.min(canvas.width, canvas.height) / 20

    let playerX = canvas.width * 0.9
    let playerY = canvas.height
    let oppX = canvas.width / 2
    let oppY = canvas.height - radius
    let goalX = oppX
    let goalY = 0

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      ctx.fillStyle = "dodgerblue";
      ctx.fillRect(goalX - radius, goalY, radius, radius);
      ctx.beginPath()
      ctx.fillStyle = "blue"
      ctx.arc(oppX, oppY, radius, 0, Math.PI * 2)// x, y, width, height
      ctx.fill()
      ctx.beginPath()
      ctx.fillStyle = "red"
      ctx.arc(playerX, playerY, radius, 0, Math.PI * 2)// x, y, width, height
      ctx.fill()
      drawForce(playerX, playerY, forceDirectionA, radius)
      drawForce(oppX, oppY, forceDirectionB, radius)
    }

    function drawForce(x, y, direction, l) {
      ctx.beginPath()
      ctx.fillStyle = "green"
      ctx.moveTo(x, y)
      d = Math.sqrt(x ** 2 + y ** 2)
      dirX = (Math.cos(direction) * x - Math.sin(direction) * y) / d
      focusX = x + dirX * l
      dirY = (Math.sin(direction) * x + Math.cos(direction) * y) / d
      focusY = y + dirY * l
      ctx.lineTo(focusX, focusY)
      ctx.stroke()
    }


    function updatePlayer(dt) {
      // console.log(1 + 2 * dt * Math.cos(forceDirectionB) + dt ** 2)
      // rho = Math.sqrt(1 + 2 * dt * Math.cos(forceDirectionB) + dt ** 2)
      // c = (1 + dt * Math.cos(forceDirectionB)) / rho
      // s = (dt * Math.sin(forceDirectionB)) / rho
      dPlayer = Math.sqrt(playerX ** 2 + playerY ** 2)
      dOpp = Math.sqrt(oppX ** 2 + oppY ** 2)
      // console.log(playerX)
      // console.log(playerY)
      // player0x = playerX + forceRatio * dt * (Math.cos(forceDirectionA) * playerX - Math.sin(forceDirectionA) * playerY) / d
      // player0y = playerY + forceRatio * dt * (Math.sin(forceDirectionA) * playerX + Math.cos(forceDirectionA) * playerY) / d
      // playerX = (c * player0x + s * player0y)
      // playerY = (-s * player0x + c * player0y)
      // console.log(rho)
      // console.log(c)
      // console.log(s)
      // console.log(d)
      // console.log(player0x)
      // console.log(player0y)
      // console.log(playerX)
      // console.log(playerY)
      playerX = playerX + forceRatio * dt * (Math.cos(forceDirectionA) * playerX - Math.sin(forceDirectionA) * playerY) / dPlayer
      playerY = playerY + forceRatio * dt * (Math.sin(forceDirectionA) * playerX + Math.cos(forceDirectionA) * playerY) / dPlayer
      deltaOppX = dt * (Math.cos(forceDirectionB) * oppX - Math.sin(forceDirectionB) * oppY) / dOpp
      deltaOppY = dt * (Math.sin(forceDirectionB) * oppX + Math.cos(forceDirectionB) * oppY) / dOpp
      newPlayer = transform(goalX, goalY, oppX + deltaOppX, oppY + deltaOppY, playerX, playerY, goalX, goalY, oppX, oppY)
      playerX = newPlayer[0]
      playerY = newPlayer[1]
    }




    function transform(ax, ay, bx, by, cx, cy, a2x, a2y, b2x, b2y) {
      ux = bx - ax
      uy = by - ay
      vx = b2x - a2x
      vy = b2y - a2y
      wx = cx - ax
      wy = cy - ay
      pUx = -uy
      pUy = ux
      pVx = -vy
      pVy = vx
      d = ux ** 2 + uy ** 2
      a = (wx * ux + wy * uy) / d
      b = (wx * pUx + wy * pUy) / d
      c2x = a2x + a * vx + b * pVx
      c2y = a2y + a * vy + b * pVy
      return [c2x, c2y]
    }

    function loop() {
      updatePlayer(0.5)
      draw()
      if (gameOver()) {
        return
      }
      requestAnimationFrame(loop)
    }

    function gameOver() {
      console.log(collinearity(playerX, playerY, oppX, oppY, goalX, goalY))
      if (Math.abs(playerX - oppX) < 1 || collinearity(playerX, playerY, oppX, oppY, goalX, goalY) < 1) {
        if (playerY < oppY) {
          console.log("You win!")
        } else {
          console.log("You lose")
        }
        return true
      } else if (Math.abs(playerX - canvas.width) < 1) {
        console.log("You lose")
        return true
      }
      return false
    }

    function collinearity(x1, y1, x2, y2, x3, y3) {
      return x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2)
    }

    window.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        updatePlayer(1)
      } else if (e.key === "q") {
        forceDirectionA = (((forceDirectionA - 0.1) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)
      } else if (e.key === "w") {
        forceDirectionA = (((forceDirectionA + 0.1) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)
      } else if (e.key === "o") {
        forceDirectionB = (((forceDirectionB - 0.1) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)
      } else if (e.key === "p") {
        forceDirectionB = (((forceDirectionB + 0.1) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)
      }
    });

    requestAnimationFrame(loop)
  </script>
</body>

</html>
